name: Context-Fabric native corpus acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-raw-compiled-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install source converter and pinned Context-Fabric runtime
        run: |
          python -m pip install -e '.[dev]'
          # Public 0.5.7 omits empty declared features from .cfm but lists them
          # in its manifest; cfabric fork PR #8 fixes that corruption.
          # Immutable commit is the reviewed, all-jobs-green fix.
          python -m pip install 'context-fabric @ git+https://github.com/alexsosn/context-fabric.git@900060ef04346af0738500cf13fc397b8087e0b8#subdirectory=libs/core'
      - name: Require importable Context-Fabric (no skipped acceptance)
        run: python -c 'from cfabric.core import Fabric; assert Fabric'
      - name: Assert native TF, raw cfabric, and compiled .cfm graph equivalence
        run: |
          python -m pytest -q tests/test_context_fabric_acceptance.py -rs
