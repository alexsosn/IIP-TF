name: IIP-TF Agora v1 materializer acceptance

on:
  pull_request:
    paths:
      - "agora.materializer.json"
      - "src/iip_tf/agora.py"
      - "src/iip_tf/_bundled_app/**"
      - "pyproject.toml"
      - "tests/test_agora_materializer.py"
      - "docs/guides/agora-materializer.md"
      - ".github/workflows/validate-agora-materializer.yml"
  push:
    branches: [main]
    paths:
      - "agora.materializer.json"
      - "src/iip_tf/agora.py"
      - "src/iip_tf/_bundled_app/**"
      - "pyproject.toml"
      - "tests/test_agora_materializer.py"
      - "docs/guides/agora-materializer.md"
      - ".github/workflows/validate-agora-materializer.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-and-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact IIP-TF head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout immutable reviewed Agora host contract
        uses: actions/checkout@v4
        with:
          repository: alexsosn/Agora
          ref: 2c94c7c024bd88b7df403cbd4ab30074367cecc5
          path: _agora_reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install converter tests, schema validator and wheel tooling
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'jsonschema>=4.22,<5' wheel
      - name: Validate manifest using exact actual Agora host, not a copied schema
        run: |
          python - <<'PY'
          import runpy
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          sys.path.insert(0, str(Path("_agora_reference").resolve()))
          from scripts.agora_materialize import load_manifest, prepare_user_source

          doc = load_manifest(Path("agora.materializer.json"))
          materializer = doc["materializers"][0]
          assert {item["type"] for item in materializer["acquisition"]} == {
              "git", "user-local"
          }
          with TemporaryDirectory() as tmp:
              fixture = runpy.run_path("tests/test_agora_materializer.py")
              source = fixture["_source"](Path(tmp))
              prepared = prepare_user_source(source, materializer)
              assert prepared.path == source
              assert prepared.provenance["type"] == "user-local"
              assert len(prepared.provenance["tree_sha256"]) == 64
          print("Agora v1 host schema and real input-acquisition validation passed")
          PY
      - name: Run actual EpiDoc to TF + person/taxonomy/browser acceptance
        run: python -m pytest -q tests/test_agora_materializer.py
      - name: Build installable wheel and prove original TF browser is packaged
        run: |
          python -m pip wheel --no-deps --no-build-isolation -w dist .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = tuple(Path("dist").glob("iip_tf-*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              for relative in ("app.py", "config.yaml", "static/display.css"):
                  path = "iip_tf/_bundled_app/" + relative
                  assert path in names, f"installed wheel omitted {path}"
                  assert wheel.read(path) == (Path("app") / relative).read_bytes()
          print("Wheel packages byte-identical source-critical TF browser")
          PY
