name: Audit pinned IIP source

on:
  pull_request:
    paths:
      - "src/iip_tf/audit.py"
      - "docs/research/iip-inventory.json"
      - "docs/research/iip-corpus-audit.md"
      - ".github/workflows/audit-pinned-iip.yml"
  push:
    branches: [main]
    paths:
      - "src/iip_tf/audit.py"
      - "docs/research/iip-inventory.json"
      - "docs/research/iip-corpus-audit.md"
      - ".github/workflows/audit-pinned-iip.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IIP-TF
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Fetch pinned Brown IIP source
        env:
          IIP_REVISION: 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5
        run: |
          set -euo pipefail
          mkdir -p upstream-iip
          curl --fail --location --retry 3 \
            "https://codeload.github.com/Brown-University-Library/iip-texts/tar.gz/${IIP_REVISION}" \
            | tar -xz --strip-components=1 -C upstream-iip
          test -d upstream-iip/epidoc-files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate pinned-source audit
        run: |
          python -m iip_tf.audit upstream-iip/epidoc-files \
            --revision 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5 \
            --json docs/research/iip-inventory.json \
            --markdown docs/research/iip-corpus-audit.md
      - name: Commit generated research artifacts on same-repo PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add docs/research/iip-inventory.json docs/research/iip-corpus-audit.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Issue #2: record generated pinned-source audit"
          git push origin "HEAD:${HEAD_REF}"
      - name: Print compact research report
        run: cat docs/research/iip-corpus-audit.md
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iip-corpus-audit
          path: |
            docs/research/iip-inventory.json
            docs/research/iip-corpus-audit.md
