name: Audit pinned IIP source

on:
  pull_request:
    paths:
      - "src/iip_tf/audit.py"
      - "docs/research/iip-inventory.json"
      - "docs/research/iip-corpus-audit.md"
      - ".github/workflows/audit-pinned-iip.yml"
  push:
    branches: [main]
    paths:
      - "src/iip_tf/audit.py"
      - "docs/research/iip-inventory.json"
      - "docs/research/iip-corpus-audit.md"
      - ".github/workflows/audit-pinned-iip.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IIP-TF
        uses: actions/checkout@v4
      - name: Fetch pinned Brown IIP source
        env:
          IIP_REVISION: 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5
        run: |
          set -euo pipefail
          mkdir -p upstream-iip
          curl --fail --location --retry 3 \
            "https://codeload.github.com/Brown-University-Library/iip-texts/tar.gz/${IIP_REVISION}" \
            | tar -xz --strip-components=1 -C upstream-iip
          test -d upstream-iip/epidoc-files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate audit from pinned source
        run: |
          python -m iip_tf.audit upstream-iip/epidoc-files \
            --revision 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5 \
            --json /tmp/iip-inventory.json \
            --markdown /tmp/iip-corpus-audit.md
      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: iip-corpus-audit
          path: |
            /tmp/iip-inventory.json
            /tmp/iip-corpus-audit.md
      - name: Check committed evidence is fresh
        run: |
          cmp /tmp/iip-inventory.json docs/research/iip-inventory.json
          cmp /tmp/iip-corpus-audit.md docs/research/iip-corpus-audit.md
      - name: Print compact research report
        if: always()
        run: cat /tmp/iip-corpus-audit.md
