name: Audit pinned IIP source

on:
  pull_request:
    paths:
      - "src/iip_tf/audit.py"
      - "src/iip_tf/facsimile_audit.py"
      - "tests/test_facsimile_audit.py"
      - "docs/research/iip-inventory.json"
      - "docs/research/iip-corpus-audit.md"
      - ".github/workflows/audit-pinned-iip.yml"
  push:
    branches: [main]
    paths:
      - "src/iip_tf/audit.py"
      - "src/iip_tf/facsimile_audit.py"
      - "tests/test_facsimile_audit.py"
      - "docs/research/iip-inventory.json"
      - "docs/research/iip-corpus-audit.md"
      - ".github/workflows/audit-pinned-iip.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IIP-TF exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pinned Brown IIP source
        env:
          IIP_REVISION: 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5
        run: |
          set -euo pipefail
          mkdir -p upstream-iip
          curl --fail --location --retry 3 \
            "https://codeload.github.com/Brown-University-Library/iip-texts/tar.gz/${IIP_REVISION}" \
            | tar -xz --strip-components=1 -C upstream-iip
          test -d upstream-iip/epidoc-files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate audit from pinned source
        run: |
          python -m iip_tf.audit upstream-iip/epidoc-files \
            --revision 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5 \
            --json /tmp/iip-inventory.json \
            --markdown /tmp/iip-corpus-audit.md
      - name: Measure source-explicit facsimile matches
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://api.github.com/repos/Brown-University-Library/iip-images/git/trees/8c5f4dc08cd31ed1fb8ae919c318206ffd5a67ab?recursive=1' \
            -o /tmp/iip-image-tree.json
          python -m iip_tf.facsimile_audit upstream-iip/epidoc-files \
            /tmp/iip-image-tree.json /tmp/iip-facsimile-audit.json
      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: iip-corpus-audit
          path: |
            /tmp/iip-inventory.json
            /tmp/iip-corpus-audit.md
            /tmp/iip-facsimile-audit.json
      - name: Verify committed evidence is fresh
        run: |
          cmp /tmp/iip-inventory.json docs/research/iip-inventory.json
          cmp /tmp/iip-corpus-audit.md docs/research/iip-corpus-audit.md
      - name: Print compact research report
        if: always()
        run: cat /tmp/iip-corpus-audit.md
