name: Audit pinned IIP source

on:
  pull_request:
    paths:
      - "src/iip_tf/audit.py"
      - "docs/research/iip-inventory.json"
      - "docs/research/iip-corpus-audit.md"
      - ".github/workflows/audit-pinned-iip.yml"
  push:
    branches: [main]
    paths:
      - "src/iip_tf/audit.py"
      - "docs/research/iip-inventory.json"
      - "docs/research/iip-corpus-audit.md"
      - ".github/workflows/audit-pinned-iip.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IIP-TF
        uses: actions/checkout@v4
      - name: Checkout pinned Brown IIP source
        uses: actions/checkout@v4
        with:
          repository: Brown-University-Library/iip-texts
          ref: 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5
          path: upstream-iip
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate pinned-source audit
        run: |
          python -m iip_tf.audit upstream-iip/epidoc-files \
            --revision 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5 \
            --json /tmp/iip-inventory.json \
            --markdown /tmp/iip-corpus-audit.md
      - name: Print compact research report
        run: cat /tmp/iip-corpus-audit.md
      - name: Print canonical inventory
        run: cat /tmp/iip-inventory.json
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iip-corpus-audit
          path: |
            /tmp/iip-inventory.json
            /tmp/iip-corpus-audit.md
