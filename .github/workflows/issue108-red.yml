name: RED #108 glyph census absent

on:
  pull_request:
    paths:
      - "tests/test_glyph_inventory.py"
      - ".github/workflows/issue108-red.yml"

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Require reproducible initial failure before census implementation
        run: python -m pytest -q tests/test_glyph_inventory.py
