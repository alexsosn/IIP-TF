name: Validate pinned native TF

on:
  pull_request:
    paths:
      - "src/iip_tf/tf_writer.py"
      - "src/iip_tf/encoded_script.py"
      - "app/**"
      - "scripts/validate_pinned_app.py"
      - "src/iip_tf/researcher_queries.py"
      - "docs/guides/researcher-quickstart.md"
      - "src/iip_tf/cli.py"
      - "src/iip_tf/release_gate.py"
      - "src/iip_tf/ir.py"
      - "src/iip_tf/text_parser.py"
      - "src/iip_tf/metadata_parser.py"
      - "src/iip_tf/person_register.py"
      - "src/iip_tf/taxonomy_resolution.py"
      - "src/iip_tf/taxonomy_audit.py"
      - "docs/guides/pinned-taxonomy-audit.md"
      - "src/iip_tf/segmentation.py"
      - "src/iip_tf/segmentation_projection.py"
      - "src/iip_tf/source_repair.py"
      - "schema/iip-tf-0.1.json"
      - "scripts/validate_pinned_tf.py"
      - "scripts/validate_pinned_context_fabric.py"
      - "tests/test_full_cfm_parity.py"
      - "scripts/validate_pinned_canary.py"
      - "schema/pinned-canary-blobs.tsv"
      - ".github/workflows/validate-pinned-tf.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/validate_pinned_app.py"
      - "src/iip_tf/researcher_queries.py"
      - "docs/guides/researcher-quickstart.md"
      - "src/iip_tf/tf_writer.py"
      - "src/iip_tf/encoded_script.py"
      - "src/iip_tf/cli.py"
      - "src/iip_tf/release_gate.py"
      - "src/iip_tf/ir.py"
      - "src/iip_tf/text_parser.py"
      - "src/iip_tf/metadata_parser.py"
      - "src/iip_tf/person_register.py"
      - "src/iip_tf/taxonomy_resolution.py"
      - "src/iip_tf/taxonomy_audit.py"
      - "docs/guides/pinned-taxonomy-audit.md"
      - "src/iip_tf/segmentation.py"
      - "src/iip_tf/segmentation_projection.py"
      - "src/iip_tf/source_repair.py"
      - "schema/iip-tf-0.1.json"
      - "scripts/validate_pinned_tf.py"
      - "scripts/validate_pinned_context_fabric.py"
      - "tests/test_full_cfm_parity.py"
      - "scripts/validate_pinned_canary.py"
      - "schema/pinned-canary-blobs.tsv"
      - ".github/workflows/validate-pinned-tf.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep this job cheap: test the same exact PR head before fetching or
  # converting 5,535 upstream records twice.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q
      - name: Authenticated real-IIP canary
        run: python scripts/validate_pinned_canary.py

  validate:
    # Do not skip the required validate job when preflight fails: skipped
    # GitHub checks can count as passing branch protection rules.
    needs: preflight
    # Evaluate failed prerequisites, but never keep a superseded PR run alive.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require green preflight
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: |
          if [ "$PREFLIGHT_RESULT" != "success" ]; then
            echo "::error::Pinned build blocked: fast preflight result=$PREFLIGHT_RESULT"
            exit 1
          fi
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pinned Brown IIP source
        env:
          IIP_REVISION: 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5
        run: |
          set -euo pipefail
          mkdir -p upstream-iip
          curl --fail --location --retry 3 \
            "https://codeload.github.com/Brown-University-Library/iip-texts/tar.gz/${IIP_REVISION}" \
            | tar -xz --strip-components=1 -C upstream-iip
          test -d upstream-iip/epidoc-files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Smoke exact pinned source taxonomy labels through researcher CLI
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          from iip_tf.taxonomy_audit import PINNED_SOURCE_REVISION, PINNED_TAXONOMY_BLOB
          from iip_tf.taxonomy_audit import parse_taxonomies

          source = Path("upstream-iip/include_taxonomies.xml")
          registry = parse_taxonomies(source.read_bytes(), expected_blob=PINNED_TAXONOMY_BLOB)
          assert sum(len(x) for x in registry.taxonomies.values()) == 142
          dotted = [
              (taxonomy, category)
              for taxonomy, categories in registry.taxonomies.items()
              for category in categories
              if "." in category
          ]
          assert len(dotted) == 39, len(dotted)
          with_prefix = [
              (taxonomy, category)
              for taxonomy, category in dotted
              if any(
                  ".".join(category.split(".")[:i]) in registry.taxonomies[taxonomy]
                  for i in range(1, len(category.split(".")))
              )
          ]
          assert len(with_prefix) == 38, len(with_prefix)
          assert set(dotted) - set(with_prefix) == {
              ("IIP-preservation", "fragment.single")
          }
          output = subprocess.check_output([
              sys.executable, "-m", "iip_tf.cli", "taxonomy-lookup",
              str(source), "material", "#stone.other #clay.terracotta",
              "--source-revision", PINNED_SOURCE_REVISION,
          ], text=True)
          result = json.loads(output)
          assert result["taxonomy_git_blob"] == PINNED_TAXONOMY_BLOB
          assert result["resolution"] == "partially_resolved"
          assert result["tokens"][0]["label"] == "Other Stone"
          assert result["tokens"][0]["dotted_prefix_candidate"] == "stone"
          assert result["tokens"][1]["status"] == "unknown"
          assert "label" not in result["tokens"][1]
          PY
      - name: Build and reload complete native TF corpus
        run: |
          python scripts/validate_pinned_tf.py \
            upstream-iip/epidoc-files \
            build/pinned-tf \
            --revision 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5 \
            --converter-commit "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate native app + Flask browser against pinned corpus
        run: python scripts/validate_pinned_app.py build/pinned-tf
      - name: Audit pinned Brown taxonomy source vs native classification values
        run: |
          python -m iip_tf.taxonomy_audit \
            upstream-iip/include_taxonomies.xml \
            build/pinned-tf \
            build/pinned-tf-reports/taxonomy-audit.json \
            --raw-original
      - name: Require successful pinned build report
        if: success()
        run: |
          test -s build/pinned-tf-reports/iip-corpus-report.json
          test -s build/pinned-tf-reports/iip-corpus-report.md
      # Reuse the already converted, byte-verified pinned corpus. Do not
      # download EpiDoc source or rebuild a third TF snapshot.
      - name: Select Python 3.13 for complete Context-Fabric acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install reviewed and immutable Context-Fabric empty-feature fix
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'context-fabric @ git+https://github.com/alexsosn/context-fabric.git@900060ef04346af0738500cf13fc397b8087e0b8#subdirectory=libs/core'
      - name: Verify entire pinned graph through raw and compiled Context-Fabric
        run: |
          python scripts/validate_pinned_context_fabric.py \
            build/pinned-tf \
            build/pinned-tf-reports/iip-corpus-report.json \
            build/pinned-tf-reports/context-fabric-parity.json
      - name: Upload reproducibility or failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iip-pinned-reproducibility-report
          path: |
            build/pinned-tf-reports/iip-corpus-report.json
            build/pinned-tf-reports/iip-corpus-report.md
            build/pinned-tf-reports/taxonomy-audit.json
            build/pinned-tf-reports/context-fabric-parity.json
          if-no-files-found: warn
