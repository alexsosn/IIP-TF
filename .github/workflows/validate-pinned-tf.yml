name: Validate pinned native TF

on:
  pull_request:
    paths:
      - "src/iip_tf/tf_writer.py"
      - "app/**"
      - "scripts/validate_pinned_app.py"
      - "src/iip_tf/researcher_queries.py"
      - "docs/guides/researcher-quickstart.md"
      - "src/iip_tf/cli.py"
      - "src/iip_tf/release_gate.py"
      - "src/iip_tf/ir.py"
      - "src/iip_tf/text_parser.py"
      - "src/iip_tf/metadata_parser.py"
      - "src/iip_tf/taxonomy_audit.py"
      - "docs/guides/pinned-taxonomy-audit.md"
      - "src/iip_tf/segmentation.py"
      - "src/iip_tf/segmentation_projection.py"
      - "src/iip_tf/source_repair.py"
      - "schema/iip-tf-0.1.json"
      - "scripts/validate_pinned_tf.py"
      - "scripts/validate_pinned_canary.py"
      - "schema/pinned-canary-blobs.tsv"
      - ".github/workflows/validate-pinned-tf.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/validate_pinned_app.py"
      - "src/iip_tf/researcher_queries.py"
      - "docs/guides/researcher-quickstart.md"
      - "src/iip_tf/tf_writer.py"
      - "src/iip_tf/cli.py"
      - "src/iip_tf/release_gate.py"
      - "src/iip_tf/ir.py"
      - "src/iip_tf/text_parser.py"
      - "src/iip_tf/metadata_parser.py"
      - "src/iip_tf/taxonomy_audit.py"
      - "docs/guides/pinned-taxonomy-audit.md"
      - "src/iip_tf/segmentation.py"
      - "src/iip_tf/segmentation_projection.py"
      - "src/iip_tf/source_repair.py"
      - "schema/iip-tf-0.1.json"
      - "scripts/validate_pinned_tf.py"
      - "scripts/validate_pinned_canary.py"
      - "schema/pinned-canary-blobs.tsv"
      - ".github/workflows/validate-pinned-tf.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep this job cheap: test the same exact PR head before fetching or
  # converting 5,535 upstream records twice.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q
      - name: Authenticated real-IIP canary
        run: python scripts/validate_pinned_canary.py

  validate:
    # Do not skip the required validate job when preflight fails: skipped
    # GitHub checks can count as passing branch protection rules.
    needs: preflight
    # Evaluate failed prerequisites, but never keep a superseded PR run alive.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require green preflight
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: |
          if [ "$PREFLIGHT_RESULT" != "success" ]; then
            echo "::error::Pinned build blocked: fast preflight result=$PREFLIGHT_RESULT"
            exit 1
          fi
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pinned Brown IIP source
        env:
          IIP_REVISION: 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5
        run: |
          set -euo pipefail
          mkdir -p upstream-iip
          curl --fail --location --retry 3 \
            "https://codeload.github.com/Brown-University-Library/iip-texts/tar.gz/${IIP_REVISION}" \
            | tar -xz --strip-components=1 -C upstream-iip
          test -d upstream-iip/epidoc-files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Build and reload complete native TF corpus
        run: |
          python scripts/validate_pinned_tf.py \
            upstream-iip/epidoc-files \
            build/pinned-tf \
            --revision 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5 \
            --converter-commit "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate native app + Flask browser against pinned corpus
        run: python scripts/validate_pinned_app.py build/pinned-tf
      - name: Audit pinned Brown taxonomy source vs native classification values
        run: |
          python -m iip_tf.taxonomy_audit \
            upstream-iip/include_taxonomies.xml \
            build/pinned-tf \
            build/pinned-tf-reports/taxonomy-audit.json
      - name: Require successful pinned build report
        if: success()
        run: |
          test -s build/pinned-tf-reports/iip-corpus-report.json
          test -s build/pinned-tf-reports/iip-corpus-report.md
      - name: Upload reproducibility or failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iip-pinned-reproducibility-report
          path: |
            build/pinned-tf-reports/iip-corpus-report.json
            build/pinned-tf-reports/iip-corpus-report.md
            build/pinned-tf-reports/taxonomy-audit.json
          if-no-files-found: warn
