name: RED #11 Agora adapter absent

on:
  pull_request:
    paths:
      - "tests/test_agora_materializer.py"
      - ".github/workflows/issue11-red.yml"

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Assert pending adapter tests fail before implementation
        run: python -m pytest -q tests/test_agora_materializer.py
