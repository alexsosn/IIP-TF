name: Validate pinned textual IR

on:
  pull_request:
    paths:
      - "src/iip_tf/ir.py"
      - "src/iip_tf/text_parser.py"
      - "src/iip_tf/metadata_parser.py"
      - "src/iip_tf/segmentation.py"
      - "src/iip_tf/segmentation_projection.py"
      - "src/iip_tf/source_repair.py"
      - "tests/test_ir.py"
      - "tests/test_text_parser.py"
      - "tests/test_metadata_parser.py"
      - "tests/test_segmentation_projection.py"
      - "schema/iip-tf-0.1.json"
      - ".github/workflows/validate-pinned-text-ir.yml"
  push:
    branches: [main]
    paths:
      - "src/iip_tf/ir.py"
      - "src/iip_tf/text_parser.py"
      - "src/iip_tf/metadata_parser.py"
      - "src/iip_tf/segmentation.py"
      - "src/iip_tf/segmentation_projection.py"
      - "schema/iip-tf-0.1.json"
      - ".github/workflows/validate-pinned-text-ir.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pinned Brown IIP source
        env:
          IIP_REVISION: 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5
        run: |
          set -euo pipefail
          mkdir -p upstream-iip
          curl --fail --location --retry 3 \
            "https://codeload.github.com/Brown-University-Library/iip-texts/tar.gz/${IIP_REVISION}" \
            | tar -xz --strip-components=1 -C upstream-iip
          test -d upstream-iip/epidoc-files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Parse every non-test record into canonical IR
        run: |
          python -m iip_tf.text_parser upstream-iip/epidoc-files \
            --revision 0b7dc8358ccdfd0c9391f049da4839fbd91c26e5 \
            --expect-parsed 5535 \
            --expect-node-count bibl=7596 \
            --expect-node-count bibl_scope=7598 \
            --expect-node-count hand=5535 \
            --expect-node-count decoration=7996 \
            --expect-node-count facsimile_surface=5667 \
            --expect-node-count image=6738 \
            --expect-node-count revision=18690 \
            --expect-node-count dimension=8658
