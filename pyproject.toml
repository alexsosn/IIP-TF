[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iip-tf"
version = "0.1.0.dev0"
description = "Convert the Inscriptions of Israel/Palestine EpiDoc corpus to Text-Fabric"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Oleksandr (Alex) Sosnovshchenko" },
]
dependencies = [
  "lxml>=5,<7",
  "text-fabric>=13.1,<14",
]

[project.scripts]
iip-tf = "iip_tf.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/alexsosn/IIP-TF"
Issues = "https://github.com/alexsosn/IIP-TF/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # make top-level research scripts importable to focused tests

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
